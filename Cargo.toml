[package]
name = "planner"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A task planner for the GNOME desktop"
license = "GPL-3.0-or-later"

[[bin]]
name = "planner"
path = "src/main.rs"

# A library as well as a binary, so integration tests and examples can drive
# the real application rather than a copy of it.
[lib]
name = "planner"
path = "src/lib.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
gio = { version = "0.22", features = ["v2_80"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Date arithmetic that is genuinely hard to hand-roll: month-end clamping,
# weekday math, and DST transitions in the local zone. Everything else in
# `model` is plain std.
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }

[dev-dependencies]
tempfile = "3"
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
