[workspace]
members = ["core", "server"]

[package]
name = "planner"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A task planner for the GNOME desktop"
license = "GPL-3.0-or-later"

[[bin]]
name = "planner"
path = "src/main.rs"

# A library as well as a binary, so integration tests and examples can drive
# the real application rather than a copy of it.
[lib]
name = "planner"
path = "src/lib.rs"

[dependencies]
# The records, the store, the query language, the quick-add parser and the
# agent interface. Links no UI toolkit, so it is the half `planner-server`
# shares and the half a shell on another platform would keep. Re-exported from
# src/lib.rs as `planner::model`, which is the path every call site here uses.
planner-core = { path = "core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
gio = { version = "0.22", features = ["v2_80"] }
# `clock` for `ui::today()`, the one place anything asks what day it is.
# planner-core takes chrono without it on purpose.
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }

[dev-dependencies]
tempfile = "3"
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
