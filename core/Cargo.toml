[package]
name = "planner-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Planner's records, queries, parsing and recurrence — nothing here draws"
license = "GPL-3.0-or-later"

[lib]
name = "planner_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Date arithmetic that is genuinely hard to hand-roll: month-end clamping,
# weekday math, and DST transitions in the local zone. Everything else here is
# plain std.
#
# No `clock` feature, deliberately. Nothing in this crate reads the clock —
# every function whose answer depends on the date takes `now` or `today` as an
# argument — and leaving the feature off is what keeps that true by
# construction rather than by discipline. The shell enables it for
# `ui::today()`, which is the one place that asks.
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "serde",
] }

[dev-dependencies]
tempfile = "3"
