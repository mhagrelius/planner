[package]
name = "planner-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Planner's records, queries, parsing and recurrence — nothing here draws"
license = "GPL-3.0-or-later"

[lib]
name = "planner_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Date arithmetic that is genuinely hard to hand-roll: month-end clamping,
# weekday math, and DST transitions in the local zone. Everything else here is
# plain std.
#
# `clock` is on for one line: `store::quarantine` stamps the name of the file
# it sets a corrupt document aside as. Nothing else here asks what time it is,
# and nothing here ever asks in order to decide an *answer* — every function
# whose result depends on the date takes `now` or `today` as an argument, which
# is the difference between a test and a bug report filed next February.
# Turning the feature off to check found exactly that one caller.
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }

[dev-dependencies]
tempfile = "3"
